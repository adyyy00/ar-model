<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive 3D powder model - View in augmented reality by placing it in your space">
    <title>AR Model</title>
    
    <!-- Model Viewer library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
        
        /* Styling for the AR button */
        .ar-button {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000;
            color: white;
            padding: 14px 28px;
            border: 2px solid #ffffff33;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.2s;
        }
        
        .ar-button:active {
            background: #333;
            transform: translateX(-50%) scale(0.95);
        }
        
        /* Hide button on desktop when AR isn't available */
        @media (hover: hover) {
            .ar-button {
                display: none;
            }
        }
        
        /* Show button when AR is available (model-viewer adds this attribute) */
        model-viewer[ar-status="session-started"] .ar-button {
            display: none;
        }
    </style>
</head>
<body>
    <model-viewer 
        id="model-viewer"
        src="./3dpowder.glb"
        ios-src="./3dpowder.usdz"
        title="3D Powder Model - Rotate to explore"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        tone-mapping="neutral"
        exposure="1"
        shadow-intensity="0.5"
        environment-image="neutral"
        autoplay
    >
        <button id="ar-button" class="ar-button" slot="ar-button">
            👁️ View in your space
        </button>
    </model-viewer>
    
    <script>
        // Handle AR button visibility gracefully
        const modelViewer = document.getElementById('model-viewer');
        const arButton = document.getElementById('ar-button');
        
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'not-presenting') {
                arButton.style.display = 'block';
            }
        });
        
        // Handle errors silently
        modelViewer.addEventListener('error', (event) => {
            console.error('Model loading error:', event.detail);
            arButton.textContent = '⚠️ AR unavailable - refresh';
        });
    </script>
</body>
</html>
